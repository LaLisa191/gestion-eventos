<!DOCTYPE html>
<html lang="es">
<head>
  <script>
   if (localStorage.getItem('session')) location.href = 'index.html';
  </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — eventos</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles-portal.css">
<link rel="stylesheet" href="styles-extra.css">
<link rel="stylesheet" href="styles-nav.css">
<link rel="stylesheet" href="styles-footer.css">
</head>
<body>

<div id="header-placeholder"></div>

<div class="registro-wrap">
  <a href="index.html" class="back-link">← Volver a eventos</a>

  <div class="registro-card">
    <h2>Crear cuenta</h2>
    <div class="meta" style="color:var(--text-muted);font-size:14px;margin-top:6px">
      Como participante puedes inscribirte a eventos. Como organizador puedes crear eventos y ver sus reportes.
    </div>

    <label for="name">Nombre completo</label>
    <input id="name" placeholder="Ana Sierra Osorio">

    <label for="email">Correo</label>
    <input id="email" type="email" placeholder="ana@correo.com">

    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="••••••••">

    <label for="tipoParticipante">Tipo de cuenta</label>
<div class="radio-group">
    <label><input type="radio" id="tipoParticipante" name="userType" value="participant" checked> Participante</label>
    <label><input type="radio" id="tipoOrganizador" name="userType" value="organizer"> Organizador</label>
</div>


    <button class="btn-primary" onclick="signup()">Crear cuenta</button>

    <div id="estado"></div>

    <p style="margin-top:20px;font-size:14px;color:var(--text-muted)">
      ¿Ya tienes cuenta? <a href="login.html" style="color:var(--text)">Inicia sesión</a>
    </p>
  </div>
</div>

<script src="auth.js"></script>
<script>

  async function signup() {
  const email = document.getElementById('email').value.trim();
if (!esCorreoValido(email)) {
  document.getElementById('estado').innerHTML = `<div class="state-box error">Escribe un correo con formato válido</div>`;
  return;
}
    const name = document.getElementById('name').value;
    const password = document.getElementById('password').value;
    const userType = document.querySelector('input[name=userType]:checked').value;

    const res = await fetch('/api/users/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, userType })
    });
    const data = await res.json();

    if (!res.ok) {
      document.getElementById('estado').innerHTML = `<div class="state-box error">${data.message}</div>`;
      return;
    }

    // inicia sesión automáticamente después de crear la cuenta
    const loginRes = await fetch('/api/users/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const loginData = await loginRes.json();
    setSession(loginData);
    location.href = 'index.html';
  }
</script>
<div id="footer-placeholder"></div>
</body>
</html>
