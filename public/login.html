<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    // Protección de ruta: Redirige al inicio si el usuario ya tiene una sesión activa 
    // para evitar que vuelva a ver el login.
   if (localStorage.getItem('session')) location.href = 'index.html';
  </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — eventos</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles-portal.css">
<link rel="stylesheet" href="styles-extra.css">
<link rel="stylesheet" href="styles-nav.css">
<link rel="stylesheet" href="styles-footer.css">
</head>
<body>

<!-- Contenedor que será llenado dinámicamente por cargarParciales() desde auth.js -->
<div id="header-placeholder"></div>

<div class="registro-wrap">
  <a href="index.html" class="back-link">← Volver a eventos</a>

  <div class="registro-card">
    <h2>Iniciar sesión</h2>
    <div class="meta" style="color:var(--text-muted);font-size:14px;margin-top:6px">
      Ingresa con tu cuenta para poder registrarte a un evento.
    </div>

    <label for="email">Correo</label>
    <input id="email" type="email" placeholder="ana@correo.com">

    <label for="password">Contraseña</label>
    <input id="password" type="password" placeholder="••••••••">

    <button class="btn-primary" onclick="login()">Iniciar sesión</button>

    <!-- Contenedor para inyectar alertas de error desde la API -->
    <div id="estado"></div>

    <p style="margin-top:20px;font-size:14px;color:var(--text-muted)">
      ¿No tienes cuenta? <a href="signup.html" style="color:var(--text)">Regístrate</a>
    </p>
  </div>
</div>

<!-- Carga funciones globales requeridas como setSession y cargarParciales -->
<script src="auth.js"></script>
<script>
  // Procesa la autenticación manejando credenciales y redirección
  async function login() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/api/users/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (res.ok) {
      // Almacena los datos del usuario en el localStorage
      setSession(data);
      
      // Manejo de URL "next": Si el usuario intentó entrar a una ruta protegida antes de loguearse,
      // la URL tendrá un parámetro "?next=ruta". Si existe, lo devuelve ahí; si no, va al inicio.
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || 'index.html';
    } else {
      // Muestra el mensaje de error proveído por el backend (ej. "Contraseña incorrecta")
      document.getElementById('estado').innerHTML = `<div class="state-box error">${data.message}</div>`;
    }
  }
</script>

<!-- Contenedor para el footer inyectado dinámicamente -->
<div id="footer-placeholder"></div>
</body>
</html>
