<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi portal — organizador</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles-portal.css">
<link rel="stylesheet" href="styles-extra.css">
<link rel="stylesheet" href="styles-nav.css">
<link rel="stylesheet" href="styles-footer.css">
<link rel="stylesheet" href="styles-imagenes.css">
<link rel="stylesheet" href="styles-confirmar.css">
</head>
<body>

<!-- Contenedor inyectado dinámicamente por auth.js -->
<div id="header-placeholder"></div>

<main class="wrap" style="padding-top:48px;padding-bottom:80px">
  <div class="section-header-row">
    <div>
      <h2 class="section-title">Mi portal</h2>
      <p class="section-sub">Los eventos que has creado, con sus inscritos y reportes.</p>
    </div>
    <!-- Botón oculto por defecto; se muestra solo si la validación de organizador es exitosa -->
    <a href="#" id="btnNuevoEvento" class="btn-primary" style="display:none">+ Nuevo evento</a>
  </div>

  <!-- Estado de error: visible si un visitante o usuario normal intenta acceder -->
  <div id="necesitaSesion" style="display:none">
    <div class="state-box error" style="max-width:460px">Debes iniciar sesión como organizador para ver tu portal.</div>
    <a href="login.html?next=organizer-portal.html" class="btn-primary" style="margin-top:16px;display:inline-flex">Iniciar sesión</a>
  </div>

  <div class="events-grid" id="grid"></div>
</main>

<!-- Modal: crear/editar evento (Se reutiliza la misma estructura para ambas acciones) -->
<div class="modal-backdrop" id="modalEvento">
  <div class="modal-card">
    <button class="modal-close" id="cerrarModalEvento" aria-label="Cerrar">×</button>
    <h3 id="tituloModalEvento">Nuevo evento</h3>

    <label for="ceNombre">Nombre del evento</label>
    <input id="ceNombre">

    <label for="ceDescripcion">Descripción</label>
    <textarea id="ceDescripcion"></textarea>

    <label for="ceFecha">Fecha</label>
    <input id="ceFecha" type="date">

    <label for="ceHora">Hora</label>
    <input id="ceHora" type="time">

    <label for="ceLugar">Lugar</label>
    <input id="ceLugar">

    <label for="ceModalidad">Modalidad</label>
    <select id="ceModalidad">
      <option value="in-person">Presencial</option>
      <option value="virtual">Virtual</option>
    </select>

    <label for="ceCupo">Cupo máximo</label>
    <input id="ceCupo" type="number" min="1">

    <label for="ceImagen">Imagen del evento (opcional)</label>
    <input id="ceImagen" type="file" accept="image/jpeg,image/png,image/webp">

    <button class="btn-primary" style="width:100%;justify-content:center;margin-top:22px" onclick="guardarEvento()">Guardar</button>
    <div id="estadoModalEvento"></div>
  </div>
</div>

<!-- Modal: reporte de asistencia (Lista en vivo de inscritos) -->
<div class="modal-backdrop" id="modalReporte">
  <div class="modal-card" style="max-width:560px">
    <button class="modal-close" id="cerrarModalReporte" aria-label="Cerrar">×</button>
    <h3 id="tituloModalReporte">Reporte de asistencia</h3>
    <div class="meta" id="resumenReporte" style="color:var(--text-muted);font-size:14px;margin-top:6px"></div>
    <table class="data-table" id="tablaReporte">
      <thead><tr><th>Participante</th><th>Correo</th><th>Fecha de registro</th></tr></thead>
      <tbody id="filasReporte"></tbody>
    </table>
  </div>
</div>

<!-- Modal: confirmar eliminación (UX: Previene borrados accidentales) -->
<div class="modal-backdrop" id="modalConfirmar">
  <div class="confirm-card" role="alertdialog" aria-modal="true"
       aria-labelledby="confirmTitulo" aria-describedby="confirmTexto">
    <h3 id="confirmTitulo">¿Eliminar evento?</h3>
    <p id="confirmTexto"></p>
    <div class="confirm-actions">
      <button class="btn-secondary" id="confirmCancelar">Cancelar</button>
      <button class="btn-primary" id="confirmAceptar">Eliminar</button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const session = getSession();
  let eventoEnEdicion = null; // null = Creación; ID = Edición
  
  // Cache local para evitar peticiones de red al abrir los modales de edición o eliminación
  let eventosCache = {};

  // --- Utilidades de renderizado ---
  function etiquetaModalidad(m) { return m === 'virtual' ? 'Virtual' : 'Presencial'; }
  function etiquetaEstado(estado) {
    const nombres = { active: 'Activo', cancelled: 'Cancelado', finished: 'Finalizado' };
    return nombres[estado] || estado;
  }
  function imagenTarjeta(ev) {
    return ev.imageUrl
      ? `<img class="event-image" src="${ev.imageUrl}" alt="${ev.name}">`
      : `<div class="event-image-placeholder"></div>`;
  }

  // --- Lógica Principal del Portal ---
  async function cargarMisEventos() {
    // Protección de ruta estricta: Solo usuarios con rol 'organizer' pueden acceder
    if (!session || session.user.userType !== 'organizer') {
      document.getElementById('necesitaSesion').style.display = 'block';
      return;
    }

    document.getElementById('btnNuevoEvento').style.display = 'inline-flex';

    // Obtiene todos los eventos y filtra en el cliente los que pertenecen al organizador actual
    const res = await fetch('/api/events');
    const events = await res.json();
    const mios = events.filter(ev => ev.organizerId === session.user.id);
    
    const grid = document.getElementById('grid');

    // Popular la caché local para tener acceso rápido a los detalles de cada evento
    eventosCache = {};
    mios.forEach(ev => { eventosCache[ev._id] = ev; });

    if (mios.length === 0) {
      grid.innerHTML = `<div class="empty-state">Todavía no has creado ningún evento.</div>`;
      return;
    }

    grid.innerHTML = mios.map(ev => `
      <div class="event-card">
        ${imagenTarjeta(ev)}
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <h3>${ev.name}</h3>
          <span class="status-pill">${etiquetaEstado(ev.status)}</span>
        </div>
        <div class="meta">${formatearFechaHora(ev.date)} · ${ev.location} · ${etiquetaModalidad(ev.modality)}</div>
        <div class="cupo-bar-track"><div class="cupo-bar-fill" style="width:${100 - (ev.availableSpots / ev.maxCapacity * 100)}%"></div></div>
        <div class="cupo-label"><span>${ev.availableSpots} cupos libres</span><span>${ev.maxCapacity} en total</span></div>
        <div class="card-actions">
          <button class="btn-secondary" onclick="abrirEdicion('${ev._id}')">Editar</button>
          <button class="btn-danger" onclick="eliminarEvento('${ev._id}')">Eliminar</button>
          <button class="btn-primary" onclick="verReporte('${ev._id}')">Reporte</button>
        </div>
      </div>
    `).join('');
  }

  // --- Modal de Formulario (Crear/Editar) ---
  
  // Limpia el formulario para crear un evento desde cero
  function abrirCreacion() {
    eventoEnEdicion = null;
    document.getElementById('tituloModalEvento').textContent = 'Nuevo evento';
    document.getElementById('ceNombre').value = '';
    document.getElementById('ceDescripcion').value = '';
    document.getElementById('ceFecha').value = '';
    document.getElementById('ceHora').value = '';
    document.getElementById('ceLugar').value = '';
    document.getElementById('ceModalidad').value = 'in-person';
    document.getElementById('ceCupo').value = '';
    document.getElementById('ceImagen').value = '';
    document.getElementById('estadoModalEvento').innerHTML = '';
    document.getElementById('modalEvento').classList.add('open');
  }

  // Precarga el formulario con los datos extraídos de eventosCache
  function abrirEdicion(id) {
    const ev = eventosCache[id];
    eventoEnEdicion = ev._id;
    document.getElementById('tituloModalEvento').textContent = 'Editar evento';
    document.getElementById('ceNombre').value = ev.name;
    document.getElementById('ceDescripcion').value = ev.description || '';
    
    // Separa el ISO String ("2023-10-15T14:30:00Z") en fecha y hora para los inputs nativos
    document.getElementById('ceFecha').value = ev.date ? ev.date.substring(0, 10) : '';
    document.getElementById('ceHora').value = ev.date ? ev.date.substring(11, 16) : '';
    
    document.getElementById('ceLugar').value = ev.location;
    document.getElementById('ceModalidad').value = ev.modality || 'in-person';
    document.getElementById('ceCupo').value = ev.maxCapacity;
    document.getElementById('ceImagen').value = '';
    
    // Alerta contextual si el evento ya posee imagen
    document.getElementById('estadoModalEvento').innerHTML = ev.imageUrl
      ? '<div class="meta" style="color:var(--text-muted);font-size:13px;margin-top:8px">Ya tiene una imagen. Elige un archivo solo si quieres reemplazarla.</div>'
      : '';
    document.getElementById('modalEvento').classList.add('open');
  }

  document.getElementById('btnNuevoEvento').addEventListener('click', (e) => {
    e.preventDefault();
    abrirCreacion();
  });

  document.getElementById('cerrarModalEvento').addEventListener('click', () => {
    document.getElementById('modalEvento').classList.remove('open');
  });

  // Envía los datos a la API multiplexando entre Crear (POST) y Editar (PUT)
  async function guardarEvento() {
    // Se requiere FormData (multipart/form-data) en lugar de JSON genérico 
    // porque el formulario permite subir archivos binarios (imagen)
    const formData = new FormData();
    formData.append('name', document.getElementById('ceNombre').value);
    formData.append('description', document.getElementById('ceDescripcion').value);
    
    const fecha = document.getElementById('ceFecha').value;
    const hora = document.getElementById('ceHora').value || '00:00';
    formData.append('date', `${fecha}T${hora}`); // Reconstruye formato ISO local
    
    formData.append('location', document.getElementById('ceLugar').value);
    formData.append('modality', document.getElementById('ceModalidad').value);
    formData.append('maxCapacity', document.getElementById('ceCupo').value);

    // Solo adjunta la imagen si el usuario seleccionó un archivo nuevo
    const archivo = document.getElementById('ceImagen').files[0];
    if (archivo) formData.append('image', archivo);

    const url = eventoEnEdicion ? `/api/events/${eventoEnEdicion}` : '/api/events';
    const method = eventoEnEdicion ? 'PUT' : 'POST';

    const res = await fetch(url, {
      method,
      headers: { 'Authorization': `Bearer ${session.token}` },
      body: formData
    });
    const data = await res.json();

    if (res.ok) {
      document.getElementById('modalEvento').classList.remove('open');
      cargarMisEventos(); // Refresca la UI al guardar
    } else {
      document.getElementById('estadoModalEvento').innerHTML = `<div class="state-box error">${data.message}</div>`;
    }
  }

  // ---------- Eliminar evento con confirmación ----------
  let eventoPorEliminar = null;
  // Máquina de estados UI: 
  // 'confirmar' = Pide permiso al usuario.
  // 'listo' = La API respondió ok, el modal ahora muestra el mensaje de éxito.
  let pasoConfirmar = 'confirmar';  

  const modalConfirmar = document.getElementById('modalConfirmar');
  const confirmTitulo = document.getElementById('confirmTitulo');
  const confirmTexto = document.getElementById('confirmTexto');
  const btnConfirmCancelar = document.getElementById('confirmCancelar');
  const btnConfirmAceptar = document.getElementById('confirmAceptar');

  // Paso 1: Abrir modal advirtiendo al usuario
  function eliminarEvento(id) {
    const ev = eventosCache[id];
    eventoPorEliminar = id;
    pasoConfirmar = 'confirmar';

    confirmTitulo.textContent = '¿Eliminar evento?';
    confirmTexto.textContent = `Vas a eliminar "${ev ? ev.name : 'este evento'}". Esta acción no se puede deshacer.`;
    btnConfirmCancelar.style.display = '';
    btnConfirmAceptar.textContent = 'Eliminar';
    btnConfirmAceptar.disabled = false;
    modalConfirmar.classList.add('open');
  }

  function cerrarConfirmar() {
    modalConfirmar.classList.remove('open');
    eventoPorEliminar = null;
  }

  btnConfirmCancelar.addEventListener('click', cerrarConfirmar);

  // Paso 2: Procesar eliminación y pasar a estado 'listo'
  btnConfirmAceptar.addEventListener('click', async () => {
    // Si ya estábamos en 'listo', el botón actúa solo para cerrar el modal
    if (pasoConfirmar === 'listo') { cerrarConfirmar(); return; }

    btnConfirmAceptar.disabled = true; // Prevenir doble clic
    try {
      const res = await fetch(`/api/events/${eventoPorEliminar}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${session.token}` }
      });

      if (res.ok) {
        pasoConfirmar = 'listo';
        confirmTitulo.textContent = 'Evento eliminado correctamente';
        confirmTexto.textContent = 'El evento ya no aparece en la lista.';
        btnConfirmCancelar.style.display = 'none'; // Ocultar botón cancelar
        btnConfirmAceptar.textContent = 'Aceptar'; // Cambiar label del botón principal
        cargarMisEventos(); // Refrescar lista de fondo
      } else {
        const data = await res.json();
        confirmTexto.textContent = data.message || 'No se pudo eliminar el evento.';
      }
    } catch (err) {
      console.error(err);
      confirmTexto.textContent = 'No hay conexión con el servidor. Inténtalo de nuevo.';
    }
    btnConfirmAceptar.disabled = false;
  });

  // UX de Accesibilidad: Cierra el modal de confirmación al hacer clic afuera o presionar Escape
  modalConfirmar.addEventListener('click', (e) => {
    if (e.target === modalConfirmar) cerrarConfirmar();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalConfirmar.classList.contains('open')) cerrarConfirmar();
  });

  // --- Modal de Reporte de Asistencia ---
  async function verReporte(id) {
    const res = await fetch(`/api/events/${id}/reports`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${session.token}` }
    });
    const data = await res.json();

    if (!res.ok) {
      alert(data.message);
      return;
    }

    // Inyecta el reporte de la API directamente en la tabla
    const nombre = eventosCache[id] ? eventosCache[id].name : '';
    document.getElementById('tituloModalReporte').textContent = `Reporte — ${nombre}`;
    document.getElementById('resumenReporte').textContent =
      `${data.data.totalRegistered} inscritos de ${data.data.maxCapacity} cupos · generado el ${new Date(data.generatedAt).toLocaleString('es-CO')}`;

    document.getElementById('filasReporte').innerHTML = data.data.participants.map(p => `
      <tr><td>${p.name}</td><td>${p.email}</td><td>${new Date(p.date).toLocaleDateString('es-CO')}</td></tr>
    `).join('') || '<tr><td colspan="3">Todavía no hay participantes inscritos.</td></tr>';

    document.getElementById('modalReporte').classList.add('open');
  }

  document.getElementById('cerrarModalReporte').addEventListener('click', () => {
    document.getElementById('modalReporte').classList.remove('open');
  });

  // Inicialización
  cargarMisEventos();

</script>
<!-- Contenedor inyectado dinámicamente por auth.js -->
<div id="footer-placeholder"></div>
</body>
</html>
