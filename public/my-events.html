<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis eventos</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="styles-portal.css">
<link rel="stylesheet" href="styles-extra.css">
<link rel="stylesheet" href="styles-nav.css">
<link rel="stylesheet" href="styles-footer.css">
<link rel="stylesheet" href="styles-confirmar.css">
</head>
<body>

<!-- Contenedor inyectado dinámicamente por auth.js -->
<div id="header-placeholder"></div>

<main class="wrap" style="padding-top:48px;padding-bottom:80px">
  <div class="section-header-row">
    <div>
      <h2 class="section-title">Mis eventos</h2>
      <p class="section-sub" id="subtitulo" style="margin-bottom:0">Los eventos a los que te has inscrito.</p>
    </div>
    <!-- Oculto por defecto; aparece solo si hay inscripciones canceladas -->
    <button class="btn-secondary" id="btnLimpiar" style="display:none" onclick="pedirLimpieza()"></button>
  </div>

  <!-- Estado de error: Se muestra únicamente si un visitante sin sesión accede a la ruta -->
  <div id="necesitaSesion" style="display:none">
    <div class="state-box error" style="max-width:420px">Debes iniciar sesión para ver tus eventos.</div>
    <a href="login.html?next=my-events.html" class="btn-primary" style="margin-top:16px;display:inline-flex">Iniciar sesión</a>
  </div>

  <!-- Contenedor principal donde se inyectarán las tarjetas de los eventos -->
  <div class="events-grid" id="grid"></div>
</main>

<!-- Modal de confirmación: se reutiliza para cancelar, eliminar una y limpiar todas -->
<div class="modal-backdrop" id="modalCancelar">
  <div class="confirm-card" role="alertdialog" aria-modal="true"
       aria-labelledby="cancelTitulo" aria-describedby="cancelTexto">
    <h3 id="cancelTitulo"></h3>
    <p id="cancelTexto"></p>
    <div class="confirm-actions">
      <button class="btn-secondary" id="cancelVolver">Volver</button>
      <button class="btn-primary" id="cancelAceptar"></button>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
    const session = getSession();

    // Guarda los datos de cada inscripción para no pasarlos por el onclick
    let inscripcionesCache = {};

    // --- Utilidades de formato ---
    // Escapa texto del usuario antes de meterlo en innerHTML
    function esc(s = '') {
        return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function etiquetaModalidad(m) {
        return m === 'virtual' ? 'Virtual' : 'Presencial';
    }

    function formatearFechaHora(fecha) {
        return new Date(fecha).toLocaleString('es-CO', {
            day: 'numeric',
            month: 'short',
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
        });
    }

    function etiquetaEstado(estado) {
        return estado === 'cancelled'
            ? '<span class="estado-inscripcion cancelado">Cancelado</span>'
            : '<span class="estado-inscripcion">Confirmado</span>';
    }

    // Si la imagen falla, se oculta y se muestra el placeholder
    function imagenTarjeta(evento) {
        const imagen = evento.imageUrl;

        if (!imagen) {
            return '<div class="event-image-placeholder"></div>';
        }

        return `
            <img
                class="event-image"
                src="${esc(imagen)}"
                alt="Imagen de ${esc(evento.name)}"
                loading="lazy"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='block'"
            >
            <div class="event-image-placeholder" style="display:none"></div>
        `;
    }

    // --- Lógica principal ---
    async function cargarMisEventos() {
        if (!session) {
            document.getElementById('necesitaSesion').style.display = 'block';
            return;
        }

        const grid = document.getElementById('grid');

        try {
            grid.innerHTML = '<div class="empty-state">Cargando tus eventos...</div>';

            // 1. Historial de inscripciones del usuario
            const res = await fetch('/api/users/me/registrations', {
                headers: { 'Authorization': `Bearer ${session.token}` }
            });

            if (!res.ok) throw new Error('No se pudieron cargar tus inscripciones.');
            const registrations = await res.json();

            // 2. Lista general de eventos para mostrar cupos reales y actuales
            let eventos = [];
            try {
                const eventosRes = await fetch('/api/events');
                if (eventosRes.ok) eventos = await eventosRes.json();
            } catch (error) {
                console.warn('No se pudo consultar la disponibilidad de cupos:', error);
            }

            const eventosPorId = new Map(
                eventos.map(ev => [String(ev._id), ev])
            );

            // Descarta inscripciones cuyo evento ya no existe
            const conEvento = registrations.filter(r => r.eventId);

            // Caché de inscripciones + botón "Limpiar cancelados"
            inscripcionesCache = {};
            conEvento.forEach(r => {
                inscripcionesCache[r._id] = {
                    eventId: r.eventId._id,
                    name: r.eventId.name,
                    status: r.status
                };
            });

            const nCancelados = conEvento.filter(r => r.status === 'cancelled').length;
            const btnLimpiar = document.getElementById('btnLimpiar');
            btnLimpiar.style.display = nCancelados ? 'inline-flex' : 'none';
            btnLimpiar.textContent = `Limpiar cancelados (${nCancelados})`;

            if (conEvento.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        Aún no te has registrado a ningún evento.
                        <a href="index.html#eventos"
                           class="btn-secondary"
                           style="margin-top:14px;display:inline-flex">
                            Ver eventos disponibles
                        </a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = conEvento.map(r => {
                const ev = r.eventId;
                const eventoActualizado = eventosPorId.get(String(ev._id)) || ev;

                const capacidad = Number(eventoActualizado.maxCapacity);
                const disponibles = eventoActualizado.availableSpots;

                const porcentaje = Number.isFinite(Number(disponibles)) && capacidad > 0
                    ? Math.max(0, Math.min(100, ((capacidad - Number(disponibles)) / capacidad) * 100))
                    : 0;

                const mostrarCupos =
                    disponibles !== undefined &&
                    Number.isFinite(Number(disponibles)) &&
                    Number.isFinite(capacidad) &&
                    capacidad > 0;

                return `
                    <div class="event-card">
                        ${imagenTarjeta(ev)}

                        <div class="evento-titulo-fila">
                            <h3>${esc(ev.name)}</h3>
                            ${etiquetaEstado(r.status)}
                        </div>

                        <div class="meta">
                            ${formatearFechaHora(ev.date)}
                            · ${esc(ev.location)}
                            · ${etiquetaModalidad(ev.modality)}
                        </div>

                        ${mostrarCupos ? `
                            <div class="cupo-bar-track">
                                <div class="cupo-bar-fill" style="width:${porcentaje}%"></div>
                            </div>
                            <div class="cupo-label">
                                <span>${disponibles} cupos libres</span>
                                <span>${capacidad} en total</span>
                            </div>
                        ` : ''}

                        <!-- Confirmada: se puede cancelar -->
                        ${r.status === 'confirmed' ? `
                            <button
                                class="btn-primary btn-cancelar"
                                onclick="pedirCancelacion('${r._id}')">
                                Cancelar registro
                            </button>
                        ` : ''}

                        <!-- Cancelada: se puede quitar de la lista -->
                        ${r.status === 'cancelled' ? `
                            <button
                                class="btn-quitar"
                                onclick="pedirEliminacion('${r._id}')">
                                Eliminar de mi lista
                            </button>
                        ` : ''}
                    </div>
                `;
            }).join('');

        } catch (error) {
            console.error(error);
            grid.innerHTML = `
                <div class="state-box error">
                    ${esc(error.message) || 'Ocurrió un error al cargar tus eventos.'}
                </div>
            `;
        }
    }

    // ---------- Modal de confirmación (cancelar / quitar / limpiar) ----------
    let accionPendiente = null;
    // 'confirmar' = pide permiso | 'listo' = la API respondió ok y se muestra el éxito
    let pasoModal = 'confirmar';

    const modalCancelar = document.getElementById('modalCancelar');
    const cancelTitulo = document.getElementById('cancelTitulo');
    const cancelTexto = document.getElementById('cancelTexto');
    const btnCancelVolver = document.getElementById('cancelVolver');
    const btnCancelAceptar = document.getElementById('cancelAceptar');

    function abrirConfirmacion(accion) {
        accionPendiente = accion;
        pasoModal = 'confirmar';
        cancelTitulo.textContent = accion.titulo;
        cancelTexto.textContent = accion.texto;
        btnCancelVolver.style.display = '';
        btnCancelAceptar.textContent = accion.textoBoton;
        btnCancelAceptar.disabled = false;
        modalCancelar.classList.add('open');
        document.body.classList.add('modal-open');
    }

    function cerrarCancelar() {
        modalCancelar.classList.remove('open');
        document.body.classList.remove('modal-open');
        accionPendiente = null;
    }

    function pedirCancelacion(registrationId) {
        const insc = inscripcionesCache[registrationId];
        if (!insc) return;
        abrirConfirmacion({
            tipo: 'cancelar', eventId: insc.eventId, registrationId,
            titulo: '¿Cancelar registro?',
            texto: `Vas a cancelar tu inscripción a "${insc.name}". Esta acción no se puede deshacer.`,
            textoBoton: 'Cancelar registro',
            exito: { titulo: 'Registro cancelado correctamente', texto: 'Tu inscripción ya aparece como cancelada.' }
        });
    }

    function pedirEliminacion(registrationId) {
        const insc = inscripcionesCache[registrationId];
        if (!insc) return;
        abrirConfirmacion({
            tipo: 'quitar', eventId: insc.eventId, registrationId,
            titulo: '¿Eliminar de tu lista?',
            texto: `"${insc.name}" dejará de aparecer en Mis eventos. Esta acción no se puede deshacer.`,
            textoBoton: 'Eliminar',
            exito: { titulo: 'Eliminado correctamente', texto: 'El evento ya no aparece en tu lista.' }
        });
    }

    function pedirLimpieza() {
        const n = Object.values(inscripcionesCache).filter(i => i.status === 'cancelled').length;
        if (n === 0) return;
        abrirConfirmacion({
            tipo: 'limpiar',
            titulo: '¿Limpiar cancelados?',
            texto: `Se eliminarán ${n} ${n === 1 ? 'inscripción cancelada' : 'inscripciones canceladas'} de tu lista. Esta acción no se puede deshacer.`,
            textoBoton: 'Limpiar',
            exito: { titulo: 'Lista limpia', texto: 'Se eliminaron tus inscripciones canceladas.' }
        });
    }

    // Cada acción llama a su ruta del backend
    function peticionDeAccion(a) {
        const headers = { 'Authorization': `Bearer ${session.token}` };

        if (a.tipo === 'cancelar') {
            return fetch(`/api/events/${a.eventId}/registrations/${a.registrationId}/cancel`, { method: 'PATCH', headers });
        }
        if (a.tipo === 'quitar') {
            return fetch(`/api/events/${a.eventId}/registrations/${a.registrationId}`, { method: 'DELETE', headers });
        }
        // 'limpiar': borra todas las canceladas del usuario
        return fetch('/api/users/me/registrations/cancelled', { method: 'DELETE', headers });
    }

    btnCancelVolver.addEventListener('click', cerrarCancelar);

    btnCancelAceptar.addEventListener('click', async () => {
        if (pasoModal === 'listo') { cerrarCancelar(); return; }
        if (!accionPendiente || !session) return;

        btnCancelAceptar.disabled = true;   // evita doble clic
        btnCancelAceptar.textContent = 'Procesando...';

        try {
            const res = await peticionDeAccion(accionPendiente);

            if (res.ok) {
                pasoModal = 'listo';
                cancelTitulo.textContent = accionPendiente.exito.titulo;
                cancelTexto.textContent = accionPendiente.exito.texto;
                btnCancelVolver.style.display = 'none';
                btnCancelAceptar.textContent = 'Aceptar';
                cargarMisEventos();   // refresca la lista de fondo
            } else {
                const data = await res.json().catch(() => ({}));
                cancelTexto.textContent = data.message || 'No se pudo completar la acción.';
                btnCancelAceptar.textContent = 'Reintentar';
            }
        } catch (err) {
            console.error(err);
            cancelTexto.textContent = 'No hay conexión con el servidor. Inténtalo de nuevo.';
            btnCancelAceptar.textContent = 'Reintentar';
        }
        btnCancelAceptar.disabled = false;
    });

    // Cerrar al hacer clic afuera o con Escape
    modalCancelar.addEventListener('click', (e) => {
        if (e.target === modalCancelar) cerrarCancelar();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalCancelar.classList.contains('open')) cerrarCancelar();
    });

    // Inicializar la vista
    cargarMisEventos();
</script>
<!-- Contenedor inyectado dinámicamente por auth.js -->
<div id="footer-placeholder"></div>
</body>
</html>
