sonar.projectKey=Gestion-de-Eventos
sonar.projectName=Gestión de Eventos
sonar.host.url=http://localhost:9000

sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,tests/**,public/uploads/**,public/vendor/**,__mocks__/**,jest.setup.js

sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# No se mide cobertura en el arranque del servidor ni en el JavaScript del navegador
sonar.coverage.exclusions=server.js,public/**